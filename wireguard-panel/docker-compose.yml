services:
  wg-easy:
    image: ghcr.io/wg-easy/wg-easy:15
    container_name: wg-easy
    hostname: wg-easy
    restart: unless-stopped

    # Required capabilities for WireGuard / AmneziaWG
    cap_add:
      - NET_ADMIN
      - SYS_MODULE

    # Required sysctls for VPN
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.src_valid_mark=1
      - net.ipv6.conf.all.disable_ipv6=0
      - net.ipv6.conf.all.forwarding=1
      - net.ipv6.conf.default.forwarding=1

    # Required device for WireGuard tunnel
    devices:
      - /dev/net/tun:/dev/net/tun

    # Port mappings
    ports:
      # Web Panel (TCP) — bound to localhost only, exposed via nginx reverse proxy on 8443
      - "127.0.0.1:51821:51821/tcp"
      # WireGuard VPN (UDP) — public; host and container ports follow INIT_PORT from .env
      - "${INIT_PORT:-51820}:${INIT_PORT:-51820}/udp"

    # Persistent storage
    volumes:
      - ./data:/etc/wireguard
      - /lib/modules:/lib/modules:ro

    # Environment configuration
    environment:
      # Unattended setup — applied ONLY on first container start
      - INIT_ENABLED=${INIT_ENABLED:-true}
      - INIT_USERNAME=${INIT_USERNAME:-admin}
      - INIT_PASSWORD=${INIT_PASSWORD}
      - INIT_HOST=${INIT_HOST}
      - INIT_PORT=${INIT_PORT:-51820}
      - INIT_DNS=${INIT_DNS:-1.1.1.1,8.8.8.8}
      # Optional: enable experimental AmneziaWG (requires amneziawg kernel module on host)
      - EXPERIMENTAL_AWG=${EXPERIMENTAL_AWG:-false}
      # Panel accepts plain HTTP — external access is via nginx TLS reverse proxy (https://DOMAIN:8443)
      - INSECURE=true
      # Timezone
      - TZ=${TZ:-Europe/Moscow}

    # Health monitoring (any HTTP response < 500 means the panel is up)
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:51821').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

    # Logging
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M

    # Attach to the shared reverse proxy network so nginx can reach the panel directly
    networks:
      wg_proxy:
        ipv4_address: 172.29.0.12

networks:
  wg_proxy:
    # Network created by the telegram-proxy compose project (nginx gateway)
    external: true
    name: revers-proxy-net